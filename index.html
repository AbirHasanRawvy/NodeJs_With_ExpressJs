<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager Server</title>
    <style>      
        body{ font-family: Arial, sons-serif; margin: 40px;}
        .container {max-width: 800px; margin: 0 auto;}
        button { padding: 10px 20px; margin: 5px; cursor: pointer;}
        textarea { width: 100%; height: 100px; margin: 10px 0;}
        .file-list { background: #f5f5f5; padding: 15px; margin: 10px 0;}
    </style>
</head>
<body>
    <div class="container">
        <h1>File Manager Server</h1>
        <input type="text" id="fileName" placeholder="File name (e.g., test.txt)">
        <textarea id="fileContent" placeholder="File content"></textarea>
        <button onclick="createFile()">Create File</button>

        <h3>Files</h3>
        <button onclick="loadFiles">Refresh File List</button>
        <div id="fileList" class="fole-list">Click 'Refresh File List' to load files.</div>

    </div>
<script src="index1.js"></script>    
</body>
</html>
